[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stipple"
version = "0.15.0"
description = "Spatial mixed-model MAP estimation with a radial-basis-function spatial field"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "anndata",
    "scanpy",
    "squidpy",
    "matplotlib",
    "joblib",
    "numpy",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["stipple", "stipple.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
